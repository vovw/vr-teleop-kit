[project]
name = "vr-teleop-kit"
version = "0.1.0"
description = "WebXR (Meta Quest) teleoperation kit for robot manipulators: WebSocket relay, clutch-relative pose mapping with reach limits, per-robot IK (I2RT YAM included), and a LeRobot Teleoperator adapter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aurel Arnold", email = "aurel@dream-machines.eu" }]
keywords = ["teleoperation", "webxr", "quest", "robotics", "lerobot", "inverse-kinematics"]
dependencies = [
    "numpy>=1.26",
    "mujoco>=3.2",
    "websockets>=13",
]

[project.optional-dependencies]
# The relay server (WebSocket broadcast + WebRTC camera streaming).
relay = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiortc>=1.9",
    "av>=12",
    "opencv-python-headless>=4.10",
]
# The LeRobot Teleoperator adapter (the hardware example additionally
# needs the i2rt driver — see the README, it installs from an i2rt clone).
lerobot = [
    "lerobot",
]

[project.urls]
Repository = "https://github.com/Dream-Machines-Robotics/vr-teleop-kit"
"YAM driver + model files" = "https://github.com/i2rt-robotics/i2rt"

[project.scripts]
vr-teleop-relay = "vr_teleop_kit.relay.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vr_teleop_kit"]
